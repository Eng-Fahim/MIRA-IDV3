plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mira.bridge'
    compileSdk 33 // 👈 هذا هو السطر المفقود المطلوب لحل المشكلة

    defaultConfig {
        applicationId "com.mira.bridge"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // الموديولات الداخلية للنظام
    implementation project(':mira-core')
    implementation project(':mira-rfid')
    implementation project(':mira-ui')
    implementation project(':mira-inventory')
}
