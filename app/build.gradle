plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mira.bridge'
    compileSdk 33

    defaultConfig {
        applicationId "com.mira.bridge"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "3.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 🔗 ربط وحدات MIRA الجديدة
    implementation project(':mira-core')
    implementation project(':mira-rfid')
    implementation project(':mira-inventory')
    implementation project(':mira-ui')

    // المكتبات الأساسية
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
}
