plugins {
    id 'com.android.library'
}

android {
    namespace 'com.mira.rfid'
    compileSdk 33

    defaultConfig {
        minSdk 24
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ⚠️ التعديل هنا: استخدام api لتصدير ملفات jar/aar لموديول app
    api fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
